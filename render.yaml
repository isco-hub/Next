databases:
  - name: nextcrop-db
    databaseName: nextcrop
    user: nextcrop
    plan: free
    postgresMajorVersion: 16

services:
  # ── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: nextcrop-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: nextcrop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: nextcrop-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MSISDN_PEPPER
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://nextcrop-web.onrender.com"]'
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: OTP_EXPIRE_SECONDS
        value: "300"
      - key: OTP_MAX_ATTEMPTS
        value: "3"
      - key: SMS_SENDER_ID
        value: NextCrop
      - key: SMS_PROVIDER_URL
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: EARTHDATA_USERNAME
        sync: false
      - key: EARTHDATA_PASSWORD
        sync: false
      - key: SENTRY_DSN
        sync: false

  # ── Celery Worker ──────────────────────────────────────────────────────────
  - type: worker
    name: nextcrop-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    dockerCommand: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nextcrop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: nextcrop-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: nextcrop-api
          type: web
          envVarKey: SECRET_KEY
      - key: MSISDN_PEPPER
        fromService:
          name: nextcrop-api
          type: web
          envVarKey: MSISDN_PEPPER
      - key: SMS_PROVIDER_URL
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: EARTHDATA_USERNAME
        sync: false
      - key: EARTHDATA_PASSWORD
        sync: false

  # ── Celery Beat ────────────────────────────────────────────────────────────
  - type: worker
    name: nextcrop-beat
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    dockerCommand: celery -A app.workers.celery_app beat --loglevel=info
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nextcrop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: nextcrop-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: nextcrop-api
          type: web
          envVarKey: SECRET_KEY
      - key: MSISDN_PEPPER
        fromService:
          name: nextcrop-api
          type: web
          envVarKey: MSISDN_PEPPER

  # ── Redis ──────────────────────────────────────────────────────────────────
  - type: redis
    name: nextcrop-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

  # ── Frontend (Static Site) ─────────────────────────────────────────────────
  - type: web
    name: nextcrop-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/apps/web/dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /v1/*
        destination: https://nextcrop-api.onrender.com/v1/:splat
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://nextcrop-api.onrender.com/v1
