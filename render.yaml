services:
  # ── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: nextcrop-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        value: postgresql+psycopg://neondb_owner:npg_EAYZ25MCovVm@ep-round-bird-bep54j95-pooler.c-9.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL_UNPOOLED
        value: postgresql+psycopg://neondb_owner:npg_EAYZ25MCovVm@ep-round-bird-bep54j95.c-9.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: REDIS_URL
        fromService:
          name: nextcrop-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MSISDN_PEPPER
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://nextcrop-web.onrender.com"]'
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: OTP_EXPIRE_SECONDS
        value: "300"
      - key: OTP_MAX_ATTEMPTS
        value: "3"
      - key: SMS_SENDER_ID
        value: NextCrop
      - key: SMS_PROVIDER_URL
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: EARTHDATA_USERNAME
        sync: false
      - key: EARTHDATA_PASSWORD
        sync: false
      - key: SENTRY_DSN
        sync: false

  # ── Redis ──────────────────────────────────────────────────────────────────
  - type: redis
    name: nextcrop-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # ── Frontend (Static Site) ─────────────────────────────────────────────────
  - type: web
    name: nextcrop-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/apps/web/dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /v1/*
        destination: https://nextcrop-api.onrender.com/v1/:splat
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://nextcrop-api.onrender.com/v1
