upstream nextcrop_api {
    server api:8000;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_ip:10m rate=120r/m;
limit_req_zone $http_x_user_id     zone=api_user:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=otp:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.nextcrop.ug;

    # TLS (SEC-01)
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # HSTS (SEC-01) — 1 year, include subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # General API — rate limited by IP and user
    location /v1/ {
        limit_req zone=api_ip burst=30 nodelay;
        limit_req zone=api_user burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://nextcrop_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # OTP endpoint — stricter rate limit (SEC-05)
    location /v1/auth/otp/ {
        limit_req zone=otp burst=2 nodelay;
        limit_req_status 429;

        proxy_pass         http://nextcrop_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # USSD callback — restricted to aggregator IPs (SEC-06)
    location /v1/ussd/callback {
        # Africa's Talking IP ranges — update with actual ranges before go-live
        allow 196.201.214.0/24;
        allow 196.201.215.0/24;
        deny  all;

        proxy_pass         http://nextcrop_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;  # USSD must respond within operator timeout
    }

    # SMS inbound webhook — restricted to aggregator IPs
    location /v1/sms/inbound {
        allow 196.201.214.0/24;
        allow 196.201.215.0/24;
        deny  all;

        proxy_pass         http://nextcrop_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Health check — no rate limit, no auth
    location /v1/health {
        proxy_pass         http://nextcrop_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log off;
    }

    # Block everything else
    location / {
        return 404;
    }

    # Logging
    access_log /var/log/nginx/nextcrop_access.log combined;
    error_log  /var/log/nginx/nextcrop_error.log warn;
}
